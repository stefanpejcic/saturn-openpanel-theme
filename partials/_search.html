{{define "search"}}<!-- START templates/partials/_search.html -->
<div data-sidebar="group-content" class="w-full text-sm" x-data="searchComponent()" id="searchGroup" data-page-find @click.outside="dropdownItems = []; activeIndex = -1" @keydown.window.slash="if (!$event.target.closest('input, textarea, select, [contenteditable]')) { $event.preventDefault(); $refs.searchInput.focus() }">
    <form action="./" method="get" autocomplete="off" novalidate="">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
        <div class="relative flex items-center justify-end">

            {{/* Saturn: the field is always open, no open-search button */}}

            <!-- search field -->
            <div
                x-show="true"
                x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 scale-x-75 translate-x-4"
                x-transition:enter-end="opacity-100 scale-x-100 translate-x-0"
                x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100 scale-x-100 translate-x-0"
                x-transition:leave-end="opacity-0 scale-x-75 translate-x-4"
                class="relative w-full origin-right [&>input]:sm:py-1.5">
                <input type="search" x-model="searchText" x-ref="searchInput" @input="fetchResults(); document.documentElement.classList.add('sat-search-open'); window.dispatchEvent(new CustomEvent('tool-find', { detail: searchText }))" @keydown.escape="closeSearch(); $el.blur()" @keydown.arrow-down.prevent="moveActive(1)" @keydown.arrow-up.prevent="moveActive(-1)" @keydown.enter.prevent="selectActive" placeholder="{{.T.Get "Search Tools"}} (/)" id="searchInput" @focus="if (window.satUserActed) document.documentElement.classList.add('sat-search-open')" @blur="document.documentElement.classList.remove('sat-search-open')"{{if eq .RequestPath "/dashboard"}} autofocus{{end}} class="relative block w-full appearance-none rounded-md border px-2.5 py-1 outline-none transition sm:text-sm border-gray-300 dark:border-gray-800 text-gray-900 dark:text-gray-50 placeholder-gray-400 dark:placeholder-gray-500 bg-white dark:bg-gray-950 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-700/30 focus:border-blue-500 dark:focus:border-blue-700 [&::-webkit-search-cancel-button]:hidden [&::-webkit-search-decoration]:hidden pl-8 pr-8 disabled:border-gray-300 disabled:bg-gray-100 disabled:text-gray-400 dark:disabled:border-gray-700 dark:disabled:bg-gray-800 dark:disabled:text-gray-500">

                <div class="pointer-events-none absolute bottom-0 left-2 flex h-full items-center justify-center text-gray-400 dark:text-gray-600"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18.031 16.6168L22.3137 20.8995L20.8995 22.3137L16.6168 18.031C15.0769 19.263 13.124 20 11 20C6.032 20 2 15.968 2 11C2 6.032 6.032 2 11 2C15.968 2 20 6.032 20 11C20 13.124 19.263 15.0769 18.031 16.6168ZM16.0247 15.8748C17.2475 14.6146 18 12.8956 18 11C18 7.1325 14.8675 4 11 4C7.1325 4 4 7.1325 4 11C4 14.8675 7.1325 18 11 18C12.8956 18 14.6146 17.2475 15.8748 16.0247L16.0247 15.8748Z"/></svg>
                </div>


                <button type="button" @click="closeSearch" class="absolute bottom-0 right-2 flex h-full items-center justify-center text-gray-400 dark:text-gray-600 hover:text-gray-700 dark:hover:text-gray-300 transition-colors" aria-label="{{.T.Get "Close search"}}"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M11.9997 10.5865L16.9495 5.63672L18.3637 7.05093L13.4139 12.0007L18.3637 16.9504L16.9495 18.3646L11.9997 13.4149L7.04996 18.3646L5.63574 16.9504L10.5855 12.0007L5.63574 7.05093L7.04996 5.63672L11.9997 10.5865Z"/></svg>
                </button>

                <!-- Search results -->
                <ul class="absolute p-1 z-50 overflow-hidden rounded-md shadow-xl shadow-black/[2.5%] min-w-48 bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-50 border border-gray-200 dark:border-gray-800 [&::-webkit-scrollbar]:w-2  [&::-webkit-scrollbar-track]:bg-gray-100  [&::-webkit-scrollbar-thumb]:bg-gray-300  dark:[&::-webkit-scrollbar-track]:bg-gray-700  dark:[&::-webkit-scrollbar-thumb]:bg-gray-500" style="top: 100%; width: 100%; right: 0px; overflow-x: hidden; overflow-y: overlay; max-height: 90vh;" aria-labelledby="searchInput" id="filteredDropdown" x-cloak x-show="dropdownItems.length">
                    <template x-for="(item, index) in dropdownItems" :key="item.id">
                        <li :class="{ 'sat-sr-li': true, 'sat-sr-head': item.header, 'sat-sr-on': activeIndex === index }" x-html="item.html"></li>
                    </template>
                </ul>
            </div>
        </div>
    </form>
</div>

<script>
// the dashboard focuses the search on load, only dim the page once the user actually reaches for it
['pointerdown', 'keydown'].forEach(function (ev) { window.addEventListener(ev, function () { window.satUserActed = true; if (ev === 'keydown' && document.activeElement && document.activeElement.id === 'searchInput') document.documentElement.classList.add('sat-search-open'); }, { capture: true, once: false }); });
function searchComponent() {
    // entity search (databases, domains, emails, ftp, containers, services, crons) is Enterprise-only,
    // and further limited to modules this user actually has access to
    const isEnterprise = {{if .IsEnterprise}}true{{else}}false{{end}};
    const entityTypes = [];
    {{if .IsEnterprise}}
        {{if .UserAllowed.mysql}}
        entityTypes.push({ type: 'mysql_databases', icon: 'ri-database-2-line', label: "{{.T.Get "MySQL Database"}}" });
        entityTypes.push({ type: 'mysql_users', icon: 'ri-user-line', label: "{{.T.Get "MySQL User"}}" });
        {{end}}
        {{if .UserAllowed.postgresql}}
        entityTypes.push({ type: 'postgresql_databases', icon: 'ri-database-2-line', label: "{{.T.Get "PostgreSQL Database"}}" });
        entityTypes.push({ type: 'postgresql_users', icon: 'ri-user-line', label: "{{.T.Get "PostgreSQL User"}}" });
        {{end}}
        {{if .UserAllowed.mongodb}}
        entityTypes.push({ type: 'mongodb_databases', icon: 'ri-database-2-line', label: "{{.T.Get "MongoDB Database"}}" });
        entityTypes.push({ type: 'mongodb_users', icon: 'ri-user-line', label: "{{.T.Get "MongoDB User"}}" });
        {{end}}
        {{if .UserAllowed.domains}}
        entityTypes.push({ type: 'domains', icon: 'ri-global-line', label: "{{.T.Get "Domain"}}" });
        {{end}}
        {{if .UserAllowed.emails}}
        entityTypes.push({ type: 'emails', icon: 'ri-mail-line', label: "{{.T.Get "Email Account"}}" });
        {{end}}
        {{if .UserAllowed.ftp}}
        entityTypes.push({ type: 'ftp', icon: 'ri-folder-shared-line', label: "{{.T.Get "FTP Account"}}" });
        {{end}}
        {{if .UserAllowed.docker}}
        entityTypes.push({ type: 'containers', icon: 'ri-stack-line', label: "{{.T.Get "Container"}}" });
        {{end}}
        {{if .UserAllowed.services}}
        entityTypes.push({ type: 'services', icon: 'ri-stack-line', label: "{{.T.Get "Service"}}" });
        {{end}}
        {{if .UserAllowed.crons}}
        entityTypes.push({ type: 'crons', icon: 'ri-calendar-line', label: "{{.T.Get "Cron Job"}}" });
        {{end}}
    {{end}}

    return {
        searchText: '',
        dropdownItems: [],
        moduleItems: [],
        entityItems: [],
        activeIndex: -1,
        debounceTimer: null,
        searchRequestId: 0,
        isOpen: false,
        openSearch() {
            this.isOpen = true;
            this.$nextTick(() => {
                this.$refs.searchInput.focus();
            });
        },
        closeSearch() {
            this.searchText = '';
            window.dispatchEvent(new CustomEvent('tool-find', { detail: '' }));
            this.dropdownItems = [];
            this.activeIndex = -1;
        },
        moveActive(step) {
            if (!this.dropdownItems.length) return;
            const max = this.dropdownItems.length - 1;
            let i = this.activeIndex;
            do { i = Math.min(max, Math.max(0, i + step)); } while (this.dropdownItems[i] && this.dropdownItems[i].header && i > 0 && i < max);
            if (this.dropdownItems[i] && this.dropdownItems[i].header) i = Math.min(max, i + 1);
            this.activeIndex = i;
        },
        selectActive() {
            const item = this.dropdownItems[this.activeIndex] || this.dropdownItems.find(i => i.link);
            if (item && item.link) {
                window.location.href = item.link;
            }
        },
        fetchResults() {
            clearTimeout(this.debounceTimer);

            const searchLower = this.searchText.toLowerCase();
            if (!searchLower) {
                this.dropdownItems = [];
                this.activeIndex = -1;
                return;
            }

            this.debounceTimer = setTimeout(() => this.performSearch(searchLower), 250);
        },
        // Renders each search type as soon as it resolves, instead of waiting on every
        // request (Promise.all) before showing anything. Enterprise entity lookups
        // (databases, domains, emails, etc.) can be slow, so they're fired independently
        // and merged in as they land. Features/pages are local + fast, so they resolve
        // first anyway, but are also kept in their own bucket to always render on top.
        renderDropdown() {
            const entities = this.entityItems.length ? [{ id: '__h_items', header: true, html: '<div class="sat-sr-group">{{.T.Get "Accounts and websites"}}</div>' }, ...this.entityItems] : [];
            this.dropdownItems = [...this.moduleItems, ...entities];
        },
        performSearch(searchLower) {
            const requestId = ++this.searchRequestId;
            this.moduleItems = [];
            this.entityItems = [];
            this.activeIndex = -1;
            this.dropdownItems = [];

            // MODULES / PAGES — always shown first, on top of any entity results
            fetch('/json/search/features').then(r => r.json()).then(features => {
                if (requestId !== this.searchRequestId) return;
                const items = [];
                const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                const section = window.satSearchSection || (window.satSearchSection = (function () {
                    // which sidebar group a page lives in, shown on the right of each result like the reference panel
                    const map = {};
                    document.querySelectorAll('#sidebar [data-nav-group]').forEach(g => {
                        const label = (g.querySelector('button') || g).textContent.trim();
                        g.querySelectorAll('a[href]').forEach(a => { const h = a.getAttribute('href').split('?')[0]; if (!map[h]) map[h] = label; });
                    });
                    return function (link) { const h = String(link || '').split('?')[0]; return map[h] || map[h.replace(/\/[^/]*$/, '')] || ''; };
                })());
                features.forEach(item => {
                    const name = item.name || '';
                    if (name.toLowerCase().includes(searchLower)) {
                        items.push({
                            id: name,
                            link: item.link,
                            html: `<a class="sat-sr" href="${esc(item.link)}"><span class="sat-sr-main"><span class="sat-sr-title">${esc(item.name)}</span><span class="sat-sr-desc">${esc(item.description)}</span></span><span class="sat-sr-cat">${esc(section(item.link))}</span></a>`
                        });
                    }
                });
                if (items.length) items.unshift({ id: '__h_tools', header: true, html: '<div class="sat-sr-group">{{.T.Get "Tools"}}</div>' });
                this.moduleItems = items;
                this.renderDropdown();
            }).catch(() => {});

            // WEBSITES — appended to the entity section as soon as it resolves
            if (isEnterprise) {
                fetch('/json/search/websites').then(r => r.ok ? r.json() : []).then(websites => {
                    if (requestId !== this.searchRequestId) return;
                    const items = [];
                    websites.forEach(item => {
                        const name = item[0] || '';
                        if (name.toLowerCase().includes(searchLower)) {
                            const link = '/website?domain=' + name;
                            items.push({
                                id: name,
                                link: link,
                                html: `<a class="sat-sr" href="${link}"><span class="sat-sr-main"><span class="sat-sr-title">${name}</span></span><span class="sat-sr-cat">{{.T.Get "Website"}}</span></a>`
                            });
                        }
                    });
                    if (!items.length) return;
                    this.entityItems = [...this.entityItems, ...items];
                    this.renderDropdown();
                }).catch(() => {});
            }

            // ENTERPRISE ENTITIES (databases, users, domains, emails, ftp, containers,
            // services, crons) — each type is fetched independently and merged into the
            // results the moment it resolves, so a slow lookup no longer blocks the ones
            // that already came back.
            entityTypes.forEach(et => {
                fetch('/json/search/' + et.type)
                    .then(r => r.ok ? r.json() : [])
                    .then(list => {
                        if (requestId !== this.searchRequestId) return;
                        const items = [];
                        (list || []).forEach(entity => {
                            const name = entity.name || '';
                            if (name.toLowerCase().includes(searchLower)) {
                                items.push({
                                    id: et.type + ':' + name,
                                    link: entity.link,
                                    html: `<a class="sat-sr" href="${entity.link}"><span class="sat-sr-main"><span class="sat-sr-title">${name}</span></span><span class="sat-sr-cat">${et.label}</span></a>`
                                });
                            }
                        });
                        if (!items.length) return;
                        this.entityItems = [...this.entityItems, ...items];
                        this.renderDropdown();
                    })
                    .catch(() => {});
            });
        }
    }
}
</script>
<!-- END templates/partials/_search.html -->
{{end}}
